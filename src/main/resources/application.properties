# RailFlow Application Configuration
spring.application.name=railflow-crowd-monitoring
server.port=8080

# IRCTC Live API Integration (RapidAPI)
rapidapi.key=mock_key_or_user_key
rapidapi.host=irctc1.p.rapidapi.com

# Logging
logging.level.com.railflow=INFO
logging.level.org.springframework.web=INFO

# ─── SQLite Persistent Storage (railflow.db) ─────────────────────────────────
spring.datasource.url=jdbc:sqlite:data/database/railflow.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# HikariCP pool — SQLite is single-writer; keep pool small
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Let RailFlow manage its own schema via DatabaseInitializer
spring.sql.init.mode=never

# Jackson date/time
spring.jackson.serialization.write-dates-as-timestamps=false
